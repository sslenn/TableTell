<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="tt_bg" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2536"/>
      <stop offset="100%" stop-color="#141926"/>
    </linearGradient>
    <linearGradient id="tt_pill_top" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5E667A"/>
      <stop offset="100%" stop-color="#4F5668"/>
    </linearGradient>
    <linearGradient id="tt_bar_l" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#70BBE8"/>
      <stop offset="100%" stop-color="#589ECE"/>
    </linearGradient>
    <linearGradient id="tt_bar_m" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58C9AC"/>
      <stop offset="100%" stop-color="#40B397"/>
    </linearGradient>
    <linearGradient id="tt_bar_r" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64A6D4"/>
      <stop offset="100%" stop-color="#5090BD"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#tt_bg)" stroke="#283246" stroke-width="1.5"/>
  <!-- Top Table Header Pill -->
  <rect x="11" y="18" width="78" height="13" rx="6.5" fill="url(#tt_pill_top)"/>
  <!-- Left Column Bar (Sky Blue) -->
  <rect x="14" y="45" width="20" height="37" rx="10" fill="url(#tt_bar_l)"/>
  <!-- Center Column Bar (Mint Green, Tall) -->
  <rect x="40" y="37" width="20" height="45" rx="10" fill="url(#tt_bar_m)"/>
  <!-- Right Column Bar (Sky Blue, Compact) -->
  <rect x="66" y="52" width="20" height="30" rx="10" fill="url(#tt_bar_r)"/>
</svg>