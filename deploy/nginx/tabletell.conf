# ==============================================================================
# Nginx Configuration for TableTell on VPS
# Place in /etc/nginx/sites-available/tabletell and symlink to /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Replace with your VPS domain or IP

    # Redirect HTTP to HTTPS (uncomment when SSL certificate is installed via Certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Server-Sent Events (SSE) Streaming Endpoint (/api/chat/stream)
    # CRITICAL: Response buffering MUST be disabled for real-time token streaming
    # --------------------------------------------------------------------------
    location /api/chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so LangGraph events stream without latency
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Keep connection open during long analytical queries
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --------------------------------------------------------------------------
    # 2. General REST API Endpoints & Health Probe
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 100M;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # 3. Static Assets (Immutable Cache for Hash-Versioned Bundles)
    # --------------------------------------------------------------------------
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # 4. SPA Frontend Fallback
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
